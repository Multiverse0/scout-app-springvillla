<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f1f3f6;--line:#e4e7ec;--text:#0f1729;--muted:#667085;
  --accent:#16a34a;--accent2:#dcfce7;--blue:#2563eb;--blue2:#dbeafe;--warn:#b45309;--warn2:#fef3c7;
  --red:#dc2626;--red2:#fee2e2;--violet:#7c3aed;--violet2:#ede9fe;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--radius:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0f17;--panel:#121826;--panel2:#1a2233;--line:#232d40;--text:#e6e9ef;--muted:#8b95a7;
  --accent:#22c55e;--accent2:#0f2e1c;--blue:#60a5fa;--blue2:#172a46;--warn:#fbbf24;--warn2:#3a2c0b;
  --red:#f87171;--red2:#3b1414;--violet:#a78bfa;--violet2:#271d45;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--blue);text-decoration:none}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:0 10px 22px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0ea5e9);display:grid;place-items:center;color:#fff;font-style:normal}
nav button{all:unset;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:9px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500;margin-bottom:2px}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--accent2);color:var(--accent)}
nav .count{margin-left:auto;font-size:12px;background:var(--panel2);padding:1px 8px;border-radius:99px}
nav .count.hot{background:var(--red);color:#fff}
.engine-mini{margin-top:18px;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:12px;color:var(--muted);line-height:1.6}
main{padding:28px 32px;max-width:1280px;width:100%}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 22px}
h2{font-size:15px;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpi .n{font-size:28px;font-weight:700;margin-top:6px}.kpi .l{color:var(--muted);font-size:13px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn:hover{filter:brightness(.97)}.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.wa{background:#25d366;color:#05301a;border-color:transparent}.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}.btn.dis{opacity:.5;pointer-events:none}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{all:unset;cursor:pointer;font-size:12px;padding:6px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.chip:hover{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.biz{font-weight:600}.small{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.p-new{background:var(--blue2);color:var(--blue)}.p-contacted{background:var(--violet2);color:var(--violet)}
.p-talking{background:var(--warn2);color:var(--warn)}.p-won{background:var(--accent2);color:var(--accent)}
.p-lost,.p-do_not_contact{background:var(--red2);color:var(--red)}.p-later{background:var(--panel2);color:var(--muted)}
.ch{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin-right:4px}
.ch-wa{background:#d9fdd3;color:#0b5c26}.ch-em{background:var(--blue2);color:var(--blue)}.ch-off{background:var(--panel2);color:var(--muted);text-decoration:line-through}
.score{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:6px;font-weight:700;font-size:12px}
.s-hi{background:var(--red2);color:var(--red)}.s-md{background:var(--warn2);color:var(--warn)}.s-lo{background:var(--panel2);color:var(--muted)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.empty{text-align:center;color:var(--muted);padding:28px}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:9}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(680px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:10;overflow:auto;transform:translateX(100%);transition:transform .25s}
.drawer.open{transform:none}.drawer-bg.open{display:block}
.dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;gap:12px;align-items:center;z-index:2}
.dbody{padding:20px;display:grid;gap:14px}
.sec h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border:0}
.ok{color:var(--accent);font-weight:700}.issue{padding:8px 10px;border-radius:8px;background:var(--red2);margin-bottom:6px;font-size:13px}
.issue b{color:var(--red)}
.thread{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto;padding:4px}
.bub{max-width:85%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.4}
.me{align-self:flex-end;background:#d9fdd3;color:#0b2e13;border-bottom-right-radius:3px}
.me.em{background:var(--blue2);color:var(--text)}
.them{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:3px}
.bub .t{font-size:10px;opacity:.65;margin-top:5px}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:9px;width:max-content;margin-bottom:10px}
.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:12px;overflow:auto}
.col{background:var(--panel2);border-radius:var(--radius);padding:10px;min-height:300px}
.col h4{margin:4px 4px 10px;font-size:12px;display:flex;justify-content:space-between}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.kc:hover{border-color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;z-index:20;max-width:90vw}
.toast.show{opacity:1}
.hint{background:var(--blue2);padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.warnbox{background:var(--warn2);padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.status-bar{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.status-bar .s{display:flex;flex-direction:column}.status-bar .s b{font-size:15px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.on{background:var(--accent)}.dot.err{background:var(--red)}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
.switch input{display:none}.switch i{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i:after{left:19px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel)}
.step .row input[type=number]{width:80px}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:8px;animation:pl 1.2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.now{background:var(--accent2);padding:10px 12px;border-radius:8px;margin:10px 0;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.res{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.feed{font:12px/1.7 ui-monospace,Consolas,monospace;color:var(--muted);max-height:220px;overflow:auto}
mark{background:#fde68a;color:#111;border-radius:3px;padding:0 2px}
pre.prev{white-space:pre-wrap;background:var(--panel2);padding:12px;border-radius:8px;font:13px/1.45 Inter,system-ui;margin:6px 0 12px}
@media (max-width:900px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow:auto;padding:10px}.logo{padding:0 10px 0 0}nav button{width:auto;white-space:nowrap}.engine-mini{display:none}.g5,.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}main{padding:18px 16px}.hide-m{display:none}}
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="logo"><i>S</i>Scout</div>
    <button data-v="today" class="on">Today <span class="count" id="c-today">0</span></button>
    <button data-v="dash">Dashboard</button>
    <button data-v="discover">Discover</button>
    <button data-v="leads">Leads <span class="count" id="c-leads">0</span></button>
    <button data-v="companies">Companies <span class="count" id="c-co">0</span></button>
    <button data-v="pipeline">Pipeline</button>
    <button data-v="sequences">Sequences</button>
    <button data-v="instagram">Instagram inbox</button>
    <button data-v="settings">Settings</button>
    <button id="pausebtn" onclick="stopAll()" style="all:unset;cursor:pointer;box-sizing:border-box;display:block;width:100%;text-align:center;margin-top:16px;padding:12px;border-radius:10px;font-weight:800;letter-spacing:.5px;background:var(--red);color:#fff">■ STOP</button>
    <div class="engine-mini" id="engmini"></div>
    <button onclick="location.href='/logout'" style="margin-top:6px;font-size:12px">Log out</button>
  </nav>
  <main id="main"></main>
</div>
<div class="drawer-bg" id="dbg"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
const S={view:'today',leads:[],jobs:{},settings:{email:{}},instagram:{},presets:[],sequences:{email:[],whatsapp:[]},engine:{},today:{replies:[],wa_due:[],upcoming:[],recent:[],events:[]},
  filter:{uk:true,status:'',q:'',ch:'',seq:'',score:0,sort:'quality',page:0,unread:false,minq:0},cofilter:{q:'',status:'',ch:'',seq:'',score:0,sort:'quality',page:0,minq:0},open:null,found:[],tab:'whatsapp',bulk:{whatsapp:true,email:true},seqEdit:null,prevKey:'',igOpen:''};
const STATUSES=['new','contacted','talking','won','lost','later','do_not_contact'];
const LABEL={new:'New',contacted:'Contacted',talking:'Talking',won:'Won',lost:'Lost',later:'Later',do_not_contact:'Do not contact'};
const ISSUE={broken_whatsapp_button:'Broken WhatsApp button',fake_phone_number:'Fake phone number',broken_call_button:'Empty call button',
  fake_email:'Email bounces',placeholder_text:'Template text left on site',empty_social_link:'Social icon goes nowhere',
  whatsapp_button_on_landline:'WhatsApp on a landline',no_whatsapp_button:'No WhatsApp button',dead_button:'Dead button',
  no_custom_domain:'No custom domain',page_failed_to_load:'Page failed to load',
  site_down:'Website down',not_mobile_friendly:'Not mobile-friendly',no_https:'Not secure (no HTTPS)',no_quote_option:'No quote button or form',
  dated_build:'Dated build',site_offline:'Site offline / deleted',old_copyright:'Old copyright year',slow_site:'Slow website',broken_images:'Broken images',
  no_contact_form:'No enquiry form',weak_google_listing:'Weak Google listing'};
const PRESETS={gmail:['smtp.gmail.com',465,'imap.gmail.com',993],zoho:['smtp.zoho.eu',465,'imap.zoho.eu',993],
  outlook:['smtp.office365.com',587,'outlook.office365.com',993]};
const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(path,opt={})=>{const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt,body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401&&path!=='/api/wa/status'){location.href='/login';return {};}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j;};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);};
const wa=(num,text)=>`https://wa.me/${num.replace('+','')}?text=${encodeURIComponent(text)}`;
const fmtNum=n=>n?'0'+n.slice(3).replace(/^(\d{4})/,'$1 '):'—';
const sc=n=>`<span class="score ${n>=6?'s-hi':n>=3?'s-md':'s-lo'}">${n}</span>`;
const pill=s=>`<span class="pill p-${s}">${LABEL[s]||s}</span>`;
const when=iso=>{if(!iso)return'';const d=new Date(iso),n=new Date(),days=Math.round((d-n)/864e5);
  const t=d.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});return t;};
const chBadges=l=>`${l.number?`<span class="ch ${l.can_wa?'ch-wa':'ch-off'}">WA</span>`:''}${l.email?`<span class="ch ${l.can_email?'ch-em':'ch-off'}">EMAIL</span>`:''}`;
const contactable=l=>l.scan.is_uk&&(l.can_wa||l.can_email);
function seqLabel(s,ch){ if(!s)return'<span class="small">Not started</span>';
  const total=S.sequences[ch]?.length||0;
  if(s.state==='active')return `<span class="ok">● Step ${Math.min(s.step+1,total)}/${total}</span> <span class="small">next ${esc(when(s.next_at))}</span>`;
  if(s.state==='paused')return `<span class="small">⏸ Paused at step ${s.step+1}/${total}</span>`;
  if(s.state==='done')return `<span class="small">✓ Sequence finished</span>`;
  if(s.state==='manual')return `<span class="small">Manual emails only</span>`;
  return `<span class="small">■ Stopped (${esc(s.stopped_reason||'')})</span>`; }

async function refresh(){
  Object.assign(S,await api('/api/state')); S.today=await api('/api/today'); S.prog=await api('/api/progress').catch(()=>S.prog);
  if(!S.seqEdit) S.seqEdit=JSON.parse(JSON.stringify(seqSource()));
  $('#c-leads').textContent=S.leads.filter(l=>l.source!=='company'&&contactable(l)).length;
  $('#c-co').textContent=S.leads.filter(l=>l.source==='company').length;
  const todo=S.today.replies.length+S.today.wa_due.length; const c=$('#c-today'); c.textContent=todo; c.classList.toggle('hot',S.today.replies.length>0);
  const e=S.engine; $('#engmini').innerHTML=`<div><span class="dot ${e.mode==='live'&&e.ready?'on':''}"></span><b>Email ${e.ready?(e.mode==='live'?'live':'paused'):'not set up'}</b></div>
    <div>UK ${esc(e.uk_time)} · ${e.in_window?'sending hours':'outside hours'}</div><div>Sent today ${e.sent_today}/${e.cap}</div>
    <div style="margin-top:6px"><span class="dot ${S.settings.autopilot?.enabled?'on':''}"></span><b>Autopilot ${S.settings.autopilot?.enabled?'on':'off'}</b></div><div>Today ${e.autopilot?.enrolled||0}/${S.settings.autopilot?.daily_target||0} leads</div>
    <div style="margin-top:6px"><span class="dot ${S.settings.whatsapp?.auto?'on':''}"></span><b>WhatsApp ${S.settings.whatsapp?.auto?'auto':'manual'}</b></div><div>Sent today ${e.wa?.sent_today||0}/${e.wa?.cap||0}</div>`;
  render(); if(S.open) drawer(S.open,true);
}
function go(v){S.view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();window.scrollTo(0,0);}
document.querySelectorAll('nav button[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
const activeJob=()=>Object.values(S.jobs).find(j=>!j.finished);
function jobCard(){const j=activeJob();if(!j)return'<div id="job"></div>';
  return `<div id="job"><div class="card"><div class="row between"><b>${j.cancelled?'Stopping…':`Scanning ${j.done}/${j.total} sites…`}</b><div class="row"><span class="small">${esc(j.current||'')}</span>
    ${j.cancelled?'':`<button class="btn sm danger" onclick="api('/api/jobs/${j.id}/stop',{method:'POST'}).then(()=>{toast('Stopping after the current site…');refresh()})">■ Stop</button>`}</div></div>
  <div class="bar" style="margin-top:10px"><i style="width:${j.done/j.total*100}%"></i></div></div></div>`;}

function engineCard(){const e=S.engine;
  return `<div class="card"><div class="row between"><div class="status-bar">
    <label class="switch" title="Live = emails send automatically"><input type="checkbox" ${e.mode==='live'?'checked':''} ${e.ready?'':'disabled'} onchange="setMode(this.checked)"><i></i>${e.mode==='live'?'Email sending: LIVE':'Email sending: paused'}</label>
    <div class="s"><span class="small">UK time</span><b>${esc(e.uk_time)}</b></div>
    <div class="s"><span class="small">Window</span><b>${e.in_window?'Open':'Closed'}</b></div>
    <div class="s"><span class="small">Sent today</span><b>${e.sent_today} / ${e.cap}</b></div>
    <div class="s"><span class="small">Due now</span><b>${e.due_now}</b></div>
    <div class="s"><span class="small">Inbox checked</span><b>${e.last_inbox?esc(when(e.last_inbox)):'never'}</b></div></div>
    <div class="row"><button class="btn sm" onclick="checkInbox()">Check inbox now</button><button class="btn sm" onclick="api('/api/engine/run',{method:'POST'}).then(()=>{toast('Engine running…');setTimeout(refresh,4000)})">Run now</button></div></div>
    <div class="row" style="margin-top:14px;gap:18px"><label class="switch"><input type="checkbox" ${S.settings.whatsapp?.auto?'checked':''} onchange="api('/api/settings',{method:'POST',body:{whatsapp:{auto:this.checked}}}).then(()=>{toast(this.checked?'WhatsApp auto-send ON':'WhatsApp auto-send off');refresh()})"><i></i>WhatsApp auto-send: ${S.settings.whatsapp?.auto?'ON':'off'}</label>
      <div class="status-bar"><div class="s"><span class="small">Sent today</span><b>${e.wa?.sent_today||0} / ${e.wa?.cap||0}</b></div><div class="s"><span class="small">Window</span><b>${e.wa?.in_window?'Open':'Closed'}</b></div><div class="s"><span class="small">Due now</span><b>${e.wa?.due_now||0}</b></div></div></div>
    ${e.wa?.error&&S.settings.whatsapp?.auto?`<div class="warnbox" style="margin-top:12px"><b>WhatsApp:</b> ${esc(e.wa.error)}. Check Settings → WhatsApp.</div>`:''}
    ${!e.ready?`<div class="hint" style="margin-top:12px">Email isn't set up yet. Add your mailbox in <a href="#" onclick="go('settings')">Settings</a> to send cold emails and detect replies automatically.</div>`:''}
    ${e.inbox_error?`<div class="warnbox" style="margin-top:12px"><b>Inbox check failed:</b> ${esc(e.inbox_error)}</div>`:''}
    ${e.send_error?`<div class="warnbox" style="margin-top:12px"><b>Last send error:</b> ${esc(e.send_error)}</div>`:''}</div>`;}
function autopilotCard(){const a=S.settings.autopilot||{},t=S.engine.autopilot||{enrolled:0,searches:0,scans:0,notes:[],pool:0,history:{}};
  const pct=Math.min(100,(t.enrolled/(a.daily_target||1))*100), hist=Object.entries(t.history||{}), mx=Math.max(a.daily_target||1,...hist.map(h=>h[1]));
  return `<div class="card"><div class="row between"><div class="row"><label class="switch"><input type="checkbox" ${a.enabled?'checked':''} onchange="apSave({enabled:this.checked})"><i></i>${a.enabled?'Autopilot ON':'Autopilot off'}</label>

const hostOf=u=>(u||'').replace(/^https?:\/\//,'').replace(/\/.*$/,'').replace(/^www\./,'');
const platOf=l=>{const h=hostOf(l.scan.site);const p=(S.platforms||[]).map(x=>x.domain).sort((a,b)=>b.length-a.length).find(d=>h.endsWith('.'+d));return p||null};
const platLabel=l=>{const p=platOf(l);return p?((S.platforms||[]).find(x=>x.domain===p)||{}).label||p:'Website'};
const lastContact=l=>{const h=[...l.history].reverse().find(x=>x.at);return h?h.at:null};
const hhmmDate=iso=>new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const hl=(t,q)=>{t=esc(t);if(!q)return t;const i=t.toLowerCase().indexOf(q.toLowerCase());return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length)};
function seqState(l){const st=['whatsapp','email'].map(c=>l.seq[c]?.state).filter(Boolean);
  if(l.history.some(h=>h.from==='them'))return 'replied'; if(!st.length)return 'not'; if(st.includes('active'))return 'running';
  if(st.includes('paused'))return 'paused'; if(st.every(x=>x==='done'))return 'done'; return 'stopped';}
function filterLeads(list,f){
  const q=(f.q||'').toLowerCase().trim();
  let r=list.filter(l=>{
    if(f.uk&&!contactable(l))return false;
    if(f.status&&l.status!==f.status)return false;
    if(f.ch==='wa'&&!l.can_wa)return false; if(f.ch==='email'&&!l.can_email)return false;
    if(f.ch==='both'&&!(l.can_wa&&l.can_email))return false; if(f.ch==='none'&&(l.can_wa||l.can_email))return false;
    if(f.seq&&seqState(l)!==f.seq)return false;
    if(f.score&&l.scan.unfinished_score<f.score)return false;
    if(f.unread&&!l.unread)return false;
    if(f.minq&&qOf(l).score<f.minq)return false;
    if(f.plat&&(f.plat==='other'?!!platOf(l):platOf(l)!==f.plat))return false;
    if(q){const hay=[l.business,l.key,l.email,l.number,l.website,l.company?.city,l.company?.name,l.notes,(l.scan.uk_signals||[]).join(' '),
        (l.scan.issues||[]).map(i=>ISSUE[i.issue]||i.issue).join(' ')].join(' ').toLowerCase(); if(!hay.includes(q))return false;}
    return true;});
  const by={quality:(a,b)=>qOf(b).score-qOf(a).score, score:(a,b)=>b.scan.unfinished_score-a.scan.unfinished_score, name:(a,b)=>a.business.localeCompare(b.business),
    recent:(a,b)=>(b.scanned_at||'').localeCompare(a.scanned_at||''), contact:(a,b)=>(lastContact(b)||'').localeCompare(lastContact(a)||'')};

async function renderInstagram(m){
  m.innerHTML='<h1>Instagram inbox</h1><div class="empty">Loading Instagram messages…</div>';

    if(S.view!=='instagram')return;
    const conversations=inbox.conversations||[];
    let active=conversations.find(c=>c.sender_id===S.igOpen);
    if(!active&&conversations.length){active=conversations[0];S.igOpen=active.sender_id;}
    const name=c=>c.username?'@'+c.username:'Instagram user '+c.sender_id.slice(-6);
    m.innerHTML=`<h1>Instagram inbox</h1><p class="sub">Reply to people who have messaged your professional account. No cold DMs or automated follow-ups.</p>

          <div class="row between"><b>${esc(name(c))}</b>${c.unread?'<span class="pill p-contacted">New</span>':''}</div>
          <div class="small" style="margin-top:5px">${esc((c.messages||[]).at(-1)?.text||'')}</div><div class="small" style="margin-top:4px">${esc(when(c.updated_at))}</div></button>`).join(''):'<div class="empty">No Instagram conversations yet. New DMs will appear here after the Meta webhook is connected.</div>'}</div>
        <div class="card">${active?`<div class="row between"><div><b>${esc(name(active))}</b><div class="small">Instagram conversation</div></div><span class="small">${instagramCanReply(active)?'Reply window open':'Reply window expired'}</span></div>
          <div class="thread" id="ig-thread" style="max-height:460px;margin:12px 0">${(active.messages||[]).map(msg=>`<div class="bub ${msg.from==='me'?'me':'them'}">${esc(msg.text)}<div class="t">${msg.from==='me'?'You':'Them'} · ${esc(when(msg.at))}</div></div>`).join('')}</div>
          ${status.configured&&instagramCanReply(active)?`<label for="ig-text">Reply (sent only when you click Send)</label><textarea id="ig-text" maxlength="1000" placeholder="Write a reply…"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" onclick="sendInstagramReply('${active.sender_id}')">Send Instagram reply</button></div>`:'<div class="small">Replies can be sent only while Meta’s 24-hour messaging window is open and the API is configured.</div>'}`
          :'<div class="empty">Choose a conversation to view it here.</div>'}</div>
      </div>`;
    const thread=$('#ig-thread');if(thread)thread.scrollTop=thread.scrollHeight;
  }catch(e){if(S.view==='instagram')m.innerHTML=`<h1>Instagram inbox</h1><div class="warnbox">${esc(e.message)}</div>`;}

function instagramCanReply(conversation){const age=Date.now()-new Date(conversation?.last_inbound_at||'').getTime();return age>=0&&age<24*60*60*1000;}
async function openInstagram(senderId){
  S.igOpen=senderId;
  try{await api(`/api/instagram/conversations/${encodeURIComponent(senderId)}/read`,{method:'POST'});}catch(e){toast(e.message);}
  renderInstagram($('#main'));
}
async function sendInstagramReply(senderId){
  const text=$('#ig-text')?.value.trim();if(!text)return toast('Write a reply first');
  if(text.length>1000)return toast('Replies are limited to 1000 characters');
  if(!confirm('Send this reply through Instagram?'))return;
  const button=document.querySelector('[onclick^="sendInstagramReply("]');if(button){button.disabled=true;button.textContent='Sending…';}
  try{await api(`/api/instagram/conversations/${encodeURIComponent(senderId)}/reply`,{method:'POST',body:{text}});
    toast('Instagram reply sent');renderInstagram($('#main'));
  }catch(e){toast(e.message);if(button){button.disabled=false;button.textContent='Send Instagram reply';}}
}

async function waBox(){const el=$('#wa-box');if(!el)return;
  if((S.settings.whatsapp?.sender||'browser')==='browser'){
    const i=await api('/api/wa/browser-info').catch(()=>({}));if(!$('#wa-box'))return;
    el.innerHTML=`${i.connected?'<div class="ok" style="font-size:15px">● Connected to your WhatsApp Web</div><div class="small" style="margin:4px 0 12px">Keep a WhatsApp Web tab open in Chrome. Scout sends through it and picks up replies from leads.</div>'
      :'<div class="warnbox">Not connected yet. Set it up once (2 minutes):</div>'}
    <ol style="line-height:1.7;padding-left:18px;margin:10px 0">
      <li><a href="/whatsapp-extension.zip">Download the Scout WhatsApp extension</a> and unzip it.</li>
      <li>In Chrome open <b>chrome://extensions</b>, switch on <b>Developer mode</b> (top right), click <b>Load unpacked</b> and pick the unzipped <b>scout-whatsapp-extension</b> folder.</li>
      <li>Click the extension's icon (puzzle piece → Scout WhatsApp Sender), enter the address and code below, and click <b>Save & test</b>.</li>
      <li>Open <b>web.whatsapp.com</b> in a tab and leave it open (it can be in the background).</li></ol>
    <label>Scout address</label><input readonly value="${location.origin}" onclick="this.select()">
    <label>Connection code</label><input readonly value="${esc(i.token||'')}" onclick="this.select();navigator.clipboard?.writeText(this.value);toast('Code copied')">
    <div class="small" style="margin-top:8px">Then tick "Send automatically" (right) and save. Messages go out one at a time within your limits, and you'll see them in WhatsApp as normal.</div>`;
    if(!i.connected&&S.view==='settings') setTimeout(waBox,8000); return;}
  let st;try{st=await api('/api/wa/status')}catch(e){st={state:'offline'}}
  if(!$('#wa-box'))return;
  const msg={ready:`<div class="ok" style="font-size:15px">● Connected${st.me?' as +'+esc(st.me):''}</div><div class="small" style="margin:6px 0 12px">Replies on this number are picked up automatically and stop the follow-ups.</div><button class="btn sm danger" onclick="if(confirm('Disconnect this WhatsApp number?'))api('/api/wa/logout',{method:'POST'}).then(()=>setTimeout(waBox,4000))">Disconnect</button>`,
    qr:`<b>Scan to connect</b><div class="small" style="margin:6px 0">On the phone: WhatsApp → Settings → Linked devices → Link a device.</div><img src="${st.qr}" style="width:260px;max-width:100%;background:#fff;padding:8px;border-radius:10px">`,
    starting:'Starting WhatsApp… (up to a minute)',authenticated:'Logging in…',offline:`<div class="warnbox">The WhatsApp service isn't running. On a server it starts with Docker; on a laptop the launcher starts it. ${esc(st.lastError||'')}</div>`};
  el.innerHTML=msg[st.state]||`<div class="warnbox">WhatsApp: ${esc(st.state)} ${esc(st.lastError||'')}</div>`;
  if(st.state!=='ready'&&S.view==='settings') setTimeout(waBox,4000);}

        <div class="small" style="margin-top:6px">Send it yourself in WhatsApp, then click "Mark as sent". If no sequence is running, follow-ups get scheduled for you.</div>`
        :'<div class="small">No UK WhatsApp number for this lead.</div>')
      :(l.email&&l.can_email?`<label>Subject (blank = reply in the existing thread)</label><input id="esubj" value="${esc(keepVals.esubj||'')}" placeholder="${esc(l.seq.email?.subject?'Re: '+l.seq.email.subject:'About the '+l.business+' website')}">
        <label>Email <span class="small" id="esrc"></span></label><textarea id="ebody" style="min-height:140px">${esc(keepVals.ebody||'')}</textarea>
        <div class="row" style="margin-top:8px"><button class="btn" id="edbtn" onclick="draftEmail('${k}')">✨ Draft with AI</button><button class="btn primary" id="esend" onclick="sendEmail('${k}')">Send email now</button></div>
        <div class="small" style="margin-top:6px">Sends from your mailbox right away, threaded with earlier emails. The opt-out line is added automatically.</div>`
        :'<div class="small">No usable email for this lead (none verified, bounced or opted out).</div>')}
    </div>
    <div class="card sec"><h3>Problems found (pitch points) · score ${s.unfinished_score} · entry £${l.entry_price}</h3>
      ${s.issues.map(i=>`<div class="issue"><b>${esc(ISSUE[i.issue]||i.issue)}</b> · ${esc(i.detail)}</div>`).join('')||'<div class="small">None found.</div>'}</div>
    <div class="card sec"><h3>Verified contacts</h3>
      ${s.whatsapp.map(w=>`<div class="line"><span><span class="ok">✓</span> WhatsApp ${fmtNum(w.number)}</span><span class="small">${esc(w.basis)}</span></div>`).join('')}
      ${s.phones.filter(p=>p.kind==='landline').map(p=>`<div class="line"><span><span class="ok">✓</span> Landline ${esc(p.e164)}</span><span class="small">${p.sources} sources</span></div>`).join('')}
      ${s.emails.map(e=>`<div class="line"><span><span class="ok">✓</span> ${esc(e.email)}</span><span class="small">mail server ${e.mx?'unverified':'confirmed'}</span></div>`).join('')}
      ${s.socials.map(x=>`<div class="line"><span><span class="ok">✓</span> <a target="_blank" href="${esc(x.url)}">${esc(x.network)}</a></span><span class="small">${esc(x.handle.slice(0,40))}</span></div>`).join('')}
      <div class="small" style="margin-top:8px">UK evidence: ${esc(s.uk_signals.slice(0,4).join(' · ')||'none')} · checked ${esc(s.checked_at)}</div></div>
    <div class="card sec"><h3>Details</h3>
      <label>Business name (used in messages)</label><div class="row"><input id="cname" value="${esc(l.business)}" style="flex:1"><button class="btn sm" onclick="patch('${k}',{custom_name:$('#cname').value})">Save</button></div>
      <label>Notes</label><textarea style="min-height:60px" onblur="patch('${k}',{notes:this.value},true)">${esc(l.notes)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn sm" onclick="doScan(['${s.site}'])">Re-scan site</button>
        <button class="btn sm danger" onclick="deleteLeads(['${l.key}'],'${esc(l.business).replace(/'/g,'')}')">🗑 Delete lead</button></div></div>
  </div>`;
  $('#drawer').classList.add('open');$('#dbg').classList.add('open');
  const th=$('#thread');if(th)th.scrollTop=th.scrollHeight;
  if(l.unread&&!keep) api('/api/leads/'+k,{method:'PATCH',body:{}}).then(()=>{l.unread=false;});
}
function closeDrawer(){S.open=null;$('#drawer').classList.remove('open');$('#dbg').classList.remove('open');refresh();}
$('#dbg').onclick=closeDrawer;
async function patch(k,body,quiet){try{await api('/api/leads/'+k,{method:'PATCH',body});if(!quiet)toast('Updated');refresh();}catch(e){toast(e.message)}}
async function seqAct(k,ch,action){try{await api(`/api/leads/${k}/sequence`,{method:'POST',body:{channel:ch,action}});toast(`${ch==='email'?'Email':'WhatsApp'} sequence: ${action}`);refresh();}catch(e){toast(e.message)}}
async function markSent(k,text){if(!text||!text.trim())return toast('Message is empty');
  await api(`/api/leads/${k}/sent`,{method:'POST',body:{text}});if($('#draft'))$('#draft').value='';toast('Logged as sent. Next follow-up scheduled.');refresh();}
async function draftReply(k){const t=$('#their').value.trim();if(!t)return toast('Paste their message first');
  const b=$('#dbtn');b.classList.add('dis');b.textContent='Drafting…';
  try{const r=await api(`/api/leads/${k}/reply`,{method:'POST',body:{text:t}});$('#their').value='';await refresh();$('#draft').value=r.draft;$('#dsrc').textContent='· drafted by '+r.source;
    if(r.dnc)toast('They opted out. Lead marked Do not contact');}catch(e){toast(e.message)}
  b.classList.remove('dis');b.textContent='✨ Log reply + draft my answer';}
async function draftEmail(k){const b=$('#edbtn');b.classList.add('dis');b.textContent='Drafting…';
  try{const r=await api(`/api/leads/${k}/draft?channel=email`,{method:'POST'});$('#ebody').value=r.draft;$('#esrc').textContent='· drafted by '+r.source;}catch(e){toast(e.message)}
  b.classList.remove('dis');b.textContent='✨ Draft with AI';}
async function sendEmail(k){const body=$('#ebody').value.trim();if(!body)return toast('Write the email first');
  if(!confirm('Send this email now?'))return;const b=$('#esend');b.classList.add('dis');
  try{await api(`/api/leads/${k}/email`,{method:'POST',body:{text:body,channel:'email',subject:$('#esubj').value||null}});$('#ebody').value='';$('#esubj').value='';toast('Email sent');refresh();}catch(e){toast(e.message)}
  b.classList.remove('dis');}

refresh().then(takeCollected); window.addEventListener('hashchange',()=>refresh().then(takeCollected));
setInterval(async()=>{ if(document.hidden)return;
  if(activeJob()){Object.assign(S,await api('/api/state'));if(!activeJob()){toast('Scan finished');return refresh();}
    const j=$('#job');if(j)j.outerHTML=jobCard();return;}
  if(!S.open&&['today','dash'].includes(S.view)&&!S.dirty.size&&!document.activeElement?.closest('.draft')) refresh();
},20000);
setInterval(async()=>{if(activeJob()){Object.assign(S,await api('/api/state'));const j=$('#job');if(j)j.outerHTML=jobCard();if(!activeJob())refresh();}},3000);
</script>
</body>
</html>
